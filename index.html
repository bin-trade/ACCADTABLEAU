<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCAD Trace · Dashboard</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="web-core/styles.css"></head>
<body class="dashboard-body"><div class="dashboard-shell">
<aside class="sidebar"><div class="brand brand-sidebar"><img src="assets/LOGO.jpg" alt="Logo ACCAD"><div><strong>ACCAD Trace</strong><small>Supervision</small></div></div><nav><button class="nav-item active" data-view="overview">Vue générale</button><button class="nav-item" data-view="operations">Opérations</button><button class="nav-item" data-view="payments">Paiements</button><button class="nav-item" data-view="verifications">Vérifications</button><button class="nav-item" data-view="funds">Situation des fonds</button><button class="nav-item" data-view="reversements">Reversements</button><button class="nav-item" data-view="agents">Agents</button><button class="nav-item" data-view="tarifs">Tarifs</button></nav><div class="sidebar-foot">Beni · Kasindi<br><span>Réseau ACCAD Trace</span></div></aside>
<main class="dashboard-main"><header class="dashboard-top"><div><p class="eyebrow">ACCAD TRACE / SUPERVISION</p><h1 id="page-title">Vue générale</h1><p class="muted">Suivi des opérations, perceptions et contrôles.</p></div><div class="top-actions"><span class="live-dot">Données centrales</span><button id="refresh" class="button-secondary">Actualiser</button></div></header>

<section id="app-panel" hidden><div class="toolbar card"><div class="filter-row"><div><label for="search">Recherche</label><input id="search" placeholder="Référence, plaque, exportateur, agent"></div><div><label for="date-from">Du</label><input id="date-from" type="date"></div><div><label for="date-to">Au</label><input id="date-to" type="date"></div><div><label for="agent-filter">Agent</label><select id="agent-filter"><option value="">Tous les agents</option></select></div><div><label for="status-filter">Statut</label><select id="status-filter"><option value="">Tous les statuts</option><option value="CONFIRMED">Confirmé</option><option value="PENDING">En attente</option></select></div><button id="apply-filters" class="button-primary">Filtrer</button></div></div><div id="content"></div></section></main></div><div id="modal" class="modal" hidden><div class="modal-card"><button id="close-modal" class="modal-close" aria-label="Fermer">×</button><div id="modal-content"></div></div></div><script src="web-core/config.js"></script><script src="web-core/theme.js"></script><script src="web-core/uppercase-inputs.js"></script><script src="app.js"></script><script>if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');</script></body></html>
