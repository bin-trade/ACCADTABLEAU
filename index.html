<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b60"><title>ACCAD Trace · Supervision</title><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/LOGO.jpg"><link rel="stylesheet" href="web-core/app.css"><link rel="stylesheet" href="web-core/dashboard.css"></head>
<body><div class="dash">
<aside class="sidebar"><div class="brand"><img src="assets/LOGO.jpg" alt="Logo ACCAD"><div><strong>ACCAD Trace</strong><small>Supervision</small></div></div>
<nav aria-label="Sections"><button class="nav-item active" data-view="overview" aria-current="page">Vue générale</button><button class="nav-item" data-view="operations">Opérations</button><button class="nav-item" data-view="payments">Paiements</button><button class="nav-item" data-view="verifications">Vérifications</button><button class="nav-item" data-view="funds">Situation des fonds</button><button class="nav-item" data-view="reversements">Reversements</button><button class="nav-item" data-view="agents">Agents</button><button class="nav-item" data-view="tarifs">Tarifs</button></nav></aside>
<div><header class="top"><div><p class="muted" style="margin:0">ACCAD TRACE / SUPERVISION</p><h1 id="page-title">Vue générale</h1></div><div class="top-actions"><span id="session-info" class="chip ok" hidden></span><button id="refresh" class="secondary">Actualiser</button><button id="logout" class="secondary">Quitter</button></div></header>
<main style="max-width:none">
<section id="login-card" class="card" style="max-width:520px"><h2>Connexion responsable</h2><p class="muted">Accès réservé aux responsables habilités.</p><form id="login-form"><label for="identifier">ID agent ou téléphone</label><input id="identifier" required autocomplete="username"><label for="code">Code agent</label><input id="code" type="password" required autocomplete="current-password"><div class="row"><button type="submit">Ouvrir le dashboard</button></div></form><div id="login-status" aria-live="polite"></div></section>
<section id="app-panel" hidden><div class="card"><div class="filters"><div><label for="search">Recherche</label><input id="search" data-upper placeholder="Référence, plaque, exportateur, agent"></div><div><label for="date-from">Du</label><input id="date-from" type="date"></div><div><label for="date-to">Au</label><input id="date-to" type="date"></div><div><label for="agent-filter">Agent</label><select id="agent-filter"><option value="">Tous les agents</option></select></div><div><label for="status-filter">Statut</label><select id="status-filter"><option value="">Tous les statuts</option><option value="CONFIRMED">Confirmé</option><option value="PENDING">En attente</option></select></div><div class="btn-cell"><button id="apply-filters" type="button">Filtrer</button></div></div></div><div id="global-status" aria-live="polite"></div><div id="content"></div></section>
</main></div></div>
<div id="modal" class="modal" hidden><div class="modal-card"><div id="modal-content"></div><div class="row"><button id="close-modal" class="secondary">Fermer</button></div></div></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<script src="web-core/config.js"></script><script src="web-core/theme.js"></script><script src="app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');</script></body></html>
